<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#111827}.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:17px}.box{fill:#fff;stroke:#334155;stroke-width:2;rx:18}.blue{fill:#eff6ff}.green{fill:#ecfdf5}.amber{fill:#fffbeb}.purple{fill:#f5f3ff}.line{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<text x="700" y="55" text-anchor="middle" class="t">외부 작업 → StudyManager → NAS → STT 처리 흐름</text>
<rect x="70" y="125" width="280" height="150" class="box blue"/><text x="210" y="165" text-anchor="middle" class="h">외부 PC</text><text x="95" y="205" class="b">① StudyManager 직접 사용</text><text x="95" y="235" class="b">② 작업 결과물만 업로드</text><text x="95" y="265" class="b">Jinlon / 기타 Windows PC</text>
<rect x="450" y="125" width="260" height="150" class="box purple"/><text x="580" y="165" text-anchor="middle" class="h">Google</text><text x="475" y="205" class="b">Sheets: 명령/상태</text><text x="475" y="235" class="b">Drive Inbox: 파일 반입</text>
<rect x="820" y="125" width="280" height="150" class="box amber"/><text x="960" y="165" text-anchor="middle" class="h">NUC 관제</text><text x="845" y="205" class="b">명령 해석 · Job 생성</text><text x="845" y="235" class="b">노드 배정 · 상태 취합</text><text x="845" y="265" class="b">오류/재시도 · Telegram</text>
<rect x="520" y="390" width="360" height="185" class="box blue"/><text x="700" y="430" text-anchor="middle" class="h">StudyManager Worker</text><text x="545" y="470" class="b">Persistent Browser Profile</text><text x="545" y="500" class="b">Login State Manager</text><text x="545" y="530" class="b">수집 · 다운로드 · 변환 · 스크랩</text><text x="545" y="560" class="b">로컬 SSD에서 작업</text>
<rect x="1000" y="390" width="280" height="185" class="box green"/><text x="1140" y="430" text-anchor="middle" class="h">NAS</text><text x="1025" y="470" class="b">원본 / MP3 / 학습노트</text><text x="1025" y="500" class="b">STT Queue / 완료 결과</text><text x="1025" y="530" class="b">사전 / 메타데이터 / 백업</text>
<rect x="1000" y="690" width="280" height="135" class="box green"/><text x="1140" y="730" text-anchor="middle" class="h">Mac mini M4</text><text x="1025" y="770" class="b">Whisper STT + 후처리</text><text x="1025" y="800" class="b">완료 후 NAS 반환</text>
<path d="M350 200 H450" class="line"/><path d="M710 200 H820" class="line"/><path d="M960 275 V340 H700 V390" class="line"/><path d="M880 485 H1000" class="line"/><path d="M1140 575 V690" class="line"/><path d="M1000 757 H940 V575" class="line"/>
<text x="700" y="650" text-anchor="middle" class="b">로그인 필요 시 WAITING_LOGIN → Telegram/Sheets 알림 → Chrome Remote Desktop으로 일회성 복구</text>
<text x="700" y="865" text-anchor="middle" class="b">외부 PC는 집 장비를 상시 원격 조작하지 않으며, 명령과 결과만 전달한다.</text></svg>